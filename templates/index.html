<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prya — Assistente Python</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <style>
    /* ── Variáveis ── */
    :root {
      --bg:         #121212;
      --surface:    #1f1f1e;
      --surface-2:  #2c2c2a;
      --border:     #2c2c2a;
      --text:       #e6e6e3;
      --text-muted: #8a8a85;
      --accent:     #94dd5f;
      --danger:     #f85149;
      --radius:     12px;
      --radius-sm:  8px;
      --read-width: 800px;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Layout principal ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* ── Cabeçalho ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-brand { display: flex; flex-direction: column; gap: 2px; }
    .brand-name   { font-size: 15px; font-weight: 600; color: var(--text); }
    .brand-sub    { font-size: 11.5px; color: var(--text-muted); }

    .btn-limpar {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 12.5px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-limpar:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Área de mensagens ── */
    #mensagens {
      flex: 1;
      overflow-y: auto;
      padding: 40px 0 28px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      scroll-behavior: smooth;
    }
    #mensagens::-webkit-scrollbar { width: 5px; }
    #mensagens::-webkit-scrollbar-track { background: transparent; }
    #mensagens::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Wrapper centralizado ── */
    .msg {
      width: 100%;
      max-width: var(--read-width);
      margin: 0 auto;
      padding: 0 24px;
      animation: fadeUp .18s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Mensagem do usuário ── */
    .msg.usuario {
      display: flex;
      justify-content: flex-end;
    }
    .msg.usuario .bolha {
      background: var(--surface-2);
      color: var(--text);
      padding: 10px 15px;
      border-radius: var(--radius);
      max-width: 72%;
      font-size: 14.5px;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* ── Mensagem da Prya — texto limpo, sem bolha ── */
    .msg.prya { display: block; }
    .msg.prya .bolha {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      word-break: break-word;
    }

    /* ── Markdown ── */
    .bolha p   { margin-bottom: 12px; }
    .bolha p:last-child { margin-bottom: 0; }
    .bolha ul, .bolha ol { padding-left: 22px; margin-bottom: 12px; }
    .bolha li  { margin-bottom: 5px; }
    .bolha strong { font-weight: 600; }
    .bolha em     { font-style: italic; }
    .bolha code:not(pre code) {
      background: var(--surface-2);
      padding: 2px 6px; border-radius: 4px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: var(--accent);
    }

    /* ── Bloco de código ── */
    .bloco-codigo {
      margin: 14px 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bloco-codigo-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .bloco-lang {
      font-size: 11px; font-weight: 600; letter-spacing: .05em;
      color: var(--text-muted); text-transform: uppercase;
    }
    .btn-copiar {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text-muted);
      font-size: 11px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .btn-copiar:hover   { border-color: var(--accent); color: var(--accent); }
    .btn-copiar.copiado { border-color: var(--accent); color: var(--accent); }
    .bloco-codigo pre {
      margin: 0 !important;
      padding: 14px 16px !important;
      overflow-x: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
    }
    .bloco-codigo pre::-webkit-scrollbar { height: 4px; }
    .bloco-codigo pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Indicador "pensando" ── */
    .pensando {
      width: 100%;
      max-width: var(--read-width);
      margin: 0 auto;
      padding: 0 24px;
      animation: fadeUp .18s ease;
    }
    .pensando-texto {
      font-size: 14px; color: var(--text-muted);
      display: flex; align-items: center; gap: 8px;
    }
    .dots { display: flex; gap: 4px; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent); opacity: .35;
      animation: pulsar 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulsar {
      0%, 80%, 100% { opacity: .35; transform: scale(1); }
      40%            { opacity: 1;   transform: scale(1.35); }
    }

    /* ── Área de input ── */
    .input-area {
      padding: 14px 0 10px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-inner {
      max-width: var(--read-width);
      margin: 0 auto;
      padding: 0 24px;
    }
    .input-wrapper {
      display: flex; gap: 10px; align-items: flex-end;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      transition: border-color .2s;
    }
    .input-wrapper:focus-within { border-color: var(--accent); }
    #campo-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 14.5px; resize: none;
      font-family: inherit; line-height: 1.5;
      max-height: 160px; overflow-y: auto;
    }
    #campo-input::placeholder { color: var(--text-muted); }
    #campo-input::-webkit-scrollbar { width: 4px; }
    #campo-input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .btn-enviar {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--accent);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity .15s, transform .1s;
    }
    .btn-enviar:hover:not(:disabled) { opacity: .82; transform: scale(1.04); }
    .btn-enviar:disabled { opacity: .25; cursor: not-allowed; }
    .btn-enviar svg { color: #121212; }

    /* ── Boas-vindas ── */
    .boas-vindas {
      width: 100%;
      max-width: var(--read-width);
      margin: auto;
      padding: 0 24px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .boas-vindas h2 { font-size: 20px; color: var(--text); font-weight: 600; }
    .boas-vindas p  { font-size: 14.5px; color: var(--text-muted); line-height: 1.65; }

    /* ── Hint do input ── */
    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 7px;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      header { padding: 11px 16px; }
      .msg, .pensando, .boas-vindas { padding: 0 16px; }
      .input-inner { padding: 0 16px; }
      .msg.usuario .bolha { max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Cabeçalho -->
  <header>
    <div class="header-brand">
      <div class="brand-name">Prya</div>
      <div class="brand-sub">Assistente Python local</div>
    </div>
    <button class="btn-limpar" onclick="limparHistorico()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
      Limpar
    </button>
  </header>

  <!-- Área de mensagens -->
  <div id="mensagens">
    <div class="boas-vindas" id="boas-vindas">
      <h2>Prya</h2>
      <p>Assistente de código Python local. Posso gerar funções, analisar bugs e explicar conceitos — tudo offline.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-inner">
      <div class="input-wrapper">
        <textarea id="campo-input" placeholder="Digite sua mensagem…" rows="1"
                  oninput="ajustarAltura(this)" onkeydown="teclaEnter(event)"></textarea>
        <button class="btn-enviar" id="btn-enviar" onclick="enviar()" title="Enviar (Shift+Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter para nova linha &nbsp;·&nbsp; Shift+Enter para enviar</div>
    </div>
  </div>

</div>

<script>
  /* ── Configuração do marked.js ── */
  const renderer = new marked.Renderer();

  renderer.code = function(code, lang) {
    const linguagem = lang && hljs.getLanguage(lang) ? lang : 'plaintext';
    const destacado = hljs.highlight(code, { language: linguagem }).value;
    const id = 'bloco-' + Math.random().toString(36).slice(2);
    return `
      <div class="bloco-codigo">
        <div class="bloco-codigo-header">
          <span class="bloco-lang">${linguagem}</span>
          <button class="btn-copiar" onclick="copiarCodigo('${id}', this)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
            Copiar
          </button>
        </div>
        <pre><code id="${id}" class="hljs language-${linguagem}">${destacado}</code></pre>
      </div>`;
  };

  marked.setOptions({ renderer, breaks: true, gfm: true });

  /* ── Estado ── */
  let streamingAtivo = false;

  /* ── Referências DOM ── */
  const $msgs       = document.getElementById('mensagens');
  const $input      = document.getElementById('campo-input');
  const $btnEnviar  = document.getElementById('btn-enviar');
  const $boasVindas = document.getElementById('boas-vindas');

  function ocultarBoasVindas() {
    if ($boasVindas) $boasVindas.remove();
  }

  function rolarParaBaixo() {
    $msgs.scrollTop = $msgs.scrollHeight;
  }

  function ajustarAltura(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function teclaEnter(e) {
    if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); enviar(); }
  }

  /* ── Cria mensagem do usuário ── */
  function criarBolhaUsuario(texto) {
    const div = document.createElement('div');
    div.className = 'msg usuario';
    div.innerHTML = `<div class="bolha">${escaparHTML(texto)}</div>`;
    $msgs.appendChild(div);
    rolarParaBaixo();
  }

  /* ── Cria mensagem da Prya (vazia, para streaming) ── */
  function criarBolhaPrya() {
    const div = document.createElement('div');
    div.className = 'msg prya';
    div.innerHTML = `<div class="bolha"></div>`;
    $msgs.appendChild(div);
    rolarParaBaixo();
    return div.querySelector('.bolha');
  }

  /* ── Atualiza conteúdo durante streaming (markdown progressivo) ── */
  function atualizarBolha(bolha, texto) {
    bolha.innerHTML = marked.parse(texto);
    rolarParaBaixo();
  }

  /* ── Finaliza com highlight.js ── */
  function finalizarBolha(bolha, texto) {
    bolha.innerHTML = marked.parse(texto);
    bolha.querySelectorAll('pre code:not(.hljs)').forEach(el => hljs.highlightElement(el));
    rolarParaBaixo();
  }

  /* ── Indicador "pensando" ── */
  function mostrarPensando() {
    const div = document.createElement('div');
    div.className = 'pensando';
    div.id = 'pensando';
    div.innerHTML = `
      <div class="pensando-texto">
        Prya está pensando
        <div class="dots"><span></span><span></span><span></span></div>
      </div>`;
    $msgs.appendChild(div);
    rolarParaBaixo();
  }

  function ocultarPensando() {
    const el = document.getElementById('pensando');
    if (el) el.remove();
  }

  /* ── Copiar código ── */
  function copiarCodigo(id, btn) {
    const codigo = document.getElementById(id)?.innerText ?? '';
    navigator.clipboard.writeText(codigo).then(() => {
      btn.classList.add('copiado');
      btn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Copiado!`;
      setTimeout(() => {
        btn.classList.remove('copiado');
        btn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copiar`;
      }, 2000);
    });
  }

  /* ── Escapar HTML ── */
  function escaparHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;')
              .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Enviar mensagem ── */
  async function enviar() {
    const texto = $input.value.trim();
    if (!texto || streamingAtivo) return;

    ocultarBoasVindas();
    criarBolhaUsuario(texto);
    $input.value = '';
    $input.style.height = 'auto';
    mostrarPensando();

    streamingAtivo = true;
    $btnEnviar.disabled = true;

    let bolha = null;
    let acumulado = '';
    let buffer = '';

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagem: texto }),
      });

      if (!resp.ok) {
        ocultarPensando();
        criarBolhaPrya().textContent = 'Erro ao processar a mensagem.';
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        const linhas = buffer.split('\n');
        buffer = linhas.pop();

        for (const linha of linhas) {
          if (!linha.startsWith('data: ')) continue;
          const dado = linha.slice(6);

          if (dado === '[FIM]') {
            finalizarBolha(bolha, acumulado);
            break;
          }

          const trecho = dado.replace(/\\n/g, '\n');

          if (!bolha) {
            ocultarPensando();
            bolha = criarBolhaPrya();
          }

          acumulado += trecho;
          atualizarBolha(bolha, acumulado);
        }
      }

      if (!bolha) {
        ocultarPensando();
        bolha = criarBolhaPrya();
        bolha.textContent = '(sem resposta)';
      }

    } catch (err) {
      ocultarPensando();
      const b = criarBolhaPrya();
      b.textContent = 'Erro de conexão. Verifique se o Ollama está rodando em localhost:11434.';
    } finally {
      streamingAtivo = false;
      $btnEnviar.disabled = false;
      $input.focus();
    }
  }

  /* ── Limpar histórico ── */
  async function limparHistorico() {
    if (streamingAtivo) return;
    await fetch('/limpar', { method: 'POST' });
    $msgs.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'boas-vindas';
    div.id = 'boas-vindas';
    div.innerHTML = `
      <h2>Prya</h2>
      <p>Assistente de código Python local. Posso gerar funções, analisar bugs e explicar conceitos — tudo offline.</p>`;
    $msgs.appendChild(div);
    $input.focus();
  }

  /* ── Foco inicial ── */
  $input.focus();
</script>
</body>
</html>
